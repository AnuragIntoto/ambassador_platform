<section
  class="w-full flex justify-content-around align-items-center login-form-section flex-column h-100"
>
  <div class="login-form">
    <div class="flex flex-column gap-2">
      <h4 class="m-0">Log in to your account!</h4>
      <p class="m-0">Enter your credentials</p>
    </div>

    <div class="form-group mt-4 flex flex-column gap-3">
      <div class="form-control">
        <p-inputgroup>
          <p-inputgroup-addon>
            <img src="assets/icon/email.svg" alt="Login Icon" />
          </p-inputgroup-addon>
          <input pInputText placeholder="Email address" />
        </p-inputgroup>
      </div>
      <div class="form-control">
        <p-inputgroup>
          <p-inputgroup-addon>
            <img src="assets/icon/lock.svg" alt="Login Icon" />
          </p-inputgroup-addon>
          <p-password [toggleMask]="true" placeholder="Password" />
        </p-inputgroup>
      </div>
      <div class="flex justify-content-between align-items-center">
        <div class="flex items-center">
          <p-checkbox [binary]="true" />
          <label class="ml-2"> Remember Me </label>
        </div>

        <a>Forget Password?</a>
      </div>
      <p-button
        label="Log In"
        severity="info"
        styleClass="w-full text-white"
        (click)="showDialog()"
      />
      <span>Having Trouble Logging In?</span>
    </div>
  </div>

  <p class="footer-text">By logging in, you agree to the <span>Terms & Conditions</span></p>
</section>

<p-dialog
  [(visible)]="visible"
  styleClass="!border-0 !bg-transparent"
  [style]="{ width: '25rem' }"
  [header]="''"
  [showHeader]="false"
>
  <div class="flex justify-content-center align-items-center flex-column mb-3 pt-5">
    <div class="header-icon mb-2 flex justify-content-center align-items-center">
      <img src="assets/icon/login-privacy.svg" alt="Login Icon" />
    </div>
    <h5>Verification Required!</h5>
  </div>

  <p>A verification email has been sent to your university email ID <span>xx@gmail.com</span></p>
</p-dialog>
