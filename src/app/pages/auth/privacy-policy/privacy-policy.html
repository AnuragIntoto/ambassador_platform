<section class="login-section">
  <p-card class="login-card">
    <div class="header">
      <div class="header-icon">
        <img src="assets/icons/roles/Vector.svg" alt="Logo" />
      </div>
      <h5>Welcome</h5>
    </div>

    <p-button
      label="Continue to Dashboard"
      severity="info"
      styleClass="w-full"
      (click)="continueToDashboard()">
    </p-button>

    <p class="terms-text">
      By continuing you agree to Intoto's <span>Conditions of Use</span> and
      <span>Privacy Notice.</span>
    </p>
  </p-card>
</section>
