<p-dialog
  [header]="title()"
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '512px', maxWidth: '95vw' }"
  styleClass="filter-modal-dialog"
  (onHide)="close.emit()"
>
  <div class="filter-modal-content">
    @if (searchPlaceholder()) {
      <div class="filter-modal-search">
        <div class="filter-search-wrapper">
          <i class="pi pi-search filter-search-icon" aria-hidden="true"></i>
          <input
            pInputText
            type="text"
            [placeholder]="searchPlaceholder()"
            (ngModelChange)="search.set($event)"
            [ngModel]="search()"
            class="filter-search-input"
          />
        </div>
      </div>
    }
    <div
      class="filter-modal-list-scroll"
      (scroll)="onScroll($event)"
    >
      <div class="filter-modal-list">
        @for (item of filteredItems(); track item.id) {
          <label class="filter-modal-option" [attr.for]="'filter-' + item.id">
            <p-checkbox
              [inputId]="'filter-' + item.id"
              [ngModel]="isChecked(item.id)"
              (ngModelChange)="toggle(item.id, $event)"
              [binary]="true"
            />
            <span class="filter-option-label">{{ item.label }}</span>
          </label>
        }
        @if (loadingMore()) {
          <div class="filter-modal-loading-more">Loading more...</div>
        }
      </div>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <div class="filter-modal-footer">
      <div class="clear-all-wrapper" [class.clear-all-applied]="hasSelection()">
        <p-button label="Clear All" severity="secondary" [outlined]="!hasSelection()" (click)="clearAll()" />
      </div>
      <p-button class="btn-applyFilter" label="Apply Filters" (click)="onApply()" />
    </div>
  </ng-template>
</p-dialog>
